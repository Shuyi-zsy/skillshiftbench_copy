name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The core package has no browser stack, so this stays in the seconds range.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Test
        run: python -m pytest -q --cov=skillshift --cov-report=term-missing

      - name: Offline smoke test
        run: python scripts/smoke_test.py

      - name: Calibration subset still matches its sampling rule
        run: python scripts/build_calibration_set.py --check

      - name: Console script is installed
        run: |
          skillshift --version
          skillshift env status --no-probe || true

  no-private-data:
    # Per-task judgements and traces must never reach a public branch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse per-task judgements and traces
        run: |
          set -e
          if git ls-files | grep -E '(^|/)(per_task\.jsonl|trajectories/|runs/)' ; then
            echo "::error::Per-task judgements or traces are tracked. SkillShift-Bench"
            echo "::error::publishes aggregate numbers only -- see docs/results-policy.md"
            exit 1
          fi
          echo "no per-task judgements or traces tracked"
