[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillshift-bench"
version = "0.1.0"
description = "SkillShift-Bench: diagnosing learned-skill executability of web agents under controlled website evolution"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["benchmark", "web-agents", "skill-transfer", "llm-agents"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core install is deliberately tiny: task registry, condition mapping,
# metric aggregation, run receipts and submission validation are pure Python.
# Anything that drives a browser lives in the `run` extra, and the sentence
# embedding retrieval path lives in `mpcr`.  This is what keeps
# `pip install skillshift-bench` viable for someone who only wants to check a
# results file before opening a leaderboard PR.
dependencies = [
    "jsonschema>=4.18",
]

[project.optional-dependencies]
run = [
    "browsergym-core==0.10.2",
    "browsergym-experiments==0.10.2",
    "browsergym-webarena==0.10.2",
    # The ceiling is browsergym's, not ours: browsergym-core 0.10.2 declares
    # `playwright~=1.39` and libwebarena 0.0.3 (via browsergym-webarena)
    # declares `playwright>=1.32,<1.40`.  Anything at or above 1.40 makes
    # `pip install -e ".[run]"` unresolvable.  `requirements-lock.txt` records
    # playwright 1.56.0, because the paper's environment was assembled without
    # the resolver agreeing; that freeze is kept verbatim and this is the pin
    # that actually installs.  Raise it only together with browsergym.
    "playwright>=1.39,<1.40",
    "openai>=1.40",
    "numpy>=1.24",
    "pillow>=10.0",
    "beartype>=0.12",
    "beautifulsoup4>=4.12",
    "pyparsing>=3.0",
    "dataclasses-json>=0.6",
    "gymnasium>=0.29",
    "tqdm>=4.66",
    "requests>=2.31",
]
mpcr = [
    "torch>=2.0",
    "transformers>=4.40",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
skillshift = "skillshift.cli:main"

[project.urls]
Homepage = "https://skillshift-bench.github.io"
Source = "https://github.com/SkillShift-Bench/skillshift-bench"
Environments = "https://github.com/SkillShift-Bench/skillshift-envs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillshift = ["schemas/*.json", "agents/mpcr/workflows/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:skillshift.registry"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Vendored code from the paper's artifact. It is kept close to the form the
# reported numbers were produced with; reformatting it would trade provenance
# for tidiness.
"src/skillshift/agents/mpcr/**" = ["E", "F", "W", "B", "UP", "I"]
"src/skillshift/eval/evaluators.py" = ["E", "F", "W", "B", "UP", "I"]
"src/skillshift/eval/llm_judge.py" = ["E", "F", "W", "B", "UP", "I"]
"src/skillshift/shifts/**" = ["E", "F", "W", "B", "UP", "I"]
"src/skillshift/tasks/task.py" = ["E", "F", "W", "B", "UP", "I"]
"src/skillshift/tasks/instance.py" = ["E", "F", "W", "B", "UP", "I"]

[tool.coverage.run]
source = ["skillshift"]
# Code vendored from the paper's artifact is excluded from the coverage
# denominator. It can only be exercised against a live browser and a deployed
# website, which the fast test job has neither of; counting it here would just
# move the number without testing anything. It is covered by the nightly
# end-to-end job in skillshift-envs instead.
omit = [
    "*/skillshift/agents/mpcr/*",
    "*/skillshift/shifts/*",
    "*/skillshift/eval/evaluators.py",
    "*/skillshift/eval/llm_judge.py",
    "*/skillshift/tasks/task.py",
    "*/skillshift/tasks/instance.py",
    "*/skillshift/tasks/registration.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
